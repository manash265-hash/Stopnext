<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopNest Admin</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><header class="topbar"><a class="brand" href="index.html">✦ ShopNest Admin</a><div class="actions"><button onclick="location.href='index.html'">Store</button><button onclick="adminLogout()">Logout</button></div></header><main class="admin-wrap"><div id="adminGuard" class="loader">Checking admin access...</div><section id="adminApp" class="hidden"><div class="admin-title"><div><small>ADMIN CONTROL CENTER</small><h1>Manage ShopNest</h1></div><button class="primary" onclick="resetProductForm()">+ New Product</button></div><div class="admin-grid"><section class="panel"><h2 id="formTitle">Add Product</h2><input type="hidden" id="productId"><label>Product name<input id="pName" placeholder="e.g. Wireless Keyboard"></label><label>Brand<input id="pBrand" placeholder="e.g. boAt, Samsung, Nike"></label><label>Category<select id="pCategory"><option>Electronics</option><option>Fashion</option><option>Beauty</option><option>Home</option><option>Kitchen</option><option>Accessories</option><option>Other</option></select></label><label>Short description<input id="pShortDescription" placeholder="One-line product summary"></label><label>Full description<textarea id="pDescription" rows="6" placeholder="Write complete product description..."></textarea></label><label>Highlights <small class="muted">One per line</small><textarea id="pHighlights" rows="5" placeholder="Fast delivery
Premium quality
1 year warranty"></textarea></label><label>Specifications <small class="muted">One per line: Key: Value</small><textarea id="pSpecifications" rows="6" placeholder="Color: Black
Material: ABS
Warranty: 1 Year"></textarea></label><div class="form-grid"><label>Supplier price<input id="pSupplier" type="number" min="0"></label><label>Selling price<input id="pSelling" type="number" min="0"></label><label>Stock<input id="pStock" type="number" min="0"></label></div><label>Product photo<input id="pImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small id="imageStatus" class="muted">Choose an image file directly. Up to 5 MB.</small></label><div id="imagePreview"></div><div class="row"><button class="primary" onclick="saveProduct()">Save Product</button><button onclick="resetProductForm()">Clear</button></div></section><section class="panel"><div class="section-head"><h2>Products</h2><button onclick="loadAdminProducts()">Refresh</button></div><div id="productTable"></div></section></div><section class="panel"><div class="section-head"><h2>Orders</h2><button onclick="loadAdminOrders()">Refresh</button></div><div id="orderTable"></div></section><section class="panel"><div class="section-head"><h2>Return Requests</h2><button onclick="loadAdminReturns()">Refresh</button></div><div id="returnTable"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
